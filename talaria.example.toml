# Talaria configuration. Domains, users and mailboxes are managed in the
# admin UI / API and stored in the database, not in this file.

hostname = "mail.example.com"
# Message bodies (compressed), certificates and temporary files.
data_dir = "/var/lib/talaria"
# Go runtime soft memory limit. 512MiB leaves room for the OS on a 2 GB box.
memory_limit = "512MiB"

[database]
# PostgreSQL holds tenants, users, mailboxes, message summaries and the
# search index. TALARIA_DATABASE_URL overrides this, so the password can
# stay out of this file (systemd: EnvironmentFile=).
url = "postgres://talaria@localhost:5432/talaria?sslmode=disable"
# Each connection is a PostgreSQL process; 10 is plenty for one server.
max_conns = 10

[log]
level = "info"
format = "json"

[http]
listen = ":8080"
# listen_tls = ":443"   # HTTPS with the [tls] certificates; required for "acme"

[smtp]
listen = ":25"            # inbound mail from the internet
# Mail apps send through these, with AUTH. STARTTLS ports need certificates
# (tls.mode "acme" or "files"); implicit-TLS ports need certificates or
# upstream_tls = true behind a gateway that terminates TLS.
submission = ":587"       # STARTTLS
submission_tls = ":465"   # implicit TLS
max_message_size = "25MiB"
max_connections = 200

[imap]
listen = ":143"       # STARTTLS
listen_tls = ":993"   # implicit TLS

# POP3 serves only the Inbox and is off unless you set the listeners.
# [pop3]
# listen = ":110"
# listen_tls = ":995"

# Most VPS providers block outbound port 25, so relay is the default.
[outbound]
mode = "relay"   # "relay" or "direct"

[outbound.relay]
host = "smtp.your-relay.example"
port = 587       # 587 (STARTTLS) or 465 (implicit TLS)
username = "apikey"
password_file = "/etc/talaria/relay-password"
timeout = "30s"

# Where TLS is terminated. Use "off" when Cloudflare Tunnel or a web gateway
# terminates HTTPS; "acme" (Let's Encrypt, needs http.listen_tls on 443) or
# "files" (certbot, acme.sh) when SMTP/IMAP face the internet. The same
# certificates serve HTTPS and every mail port.
[tls]
mode = "off"
# cert_file = "/etc/talaria/tls/fullchain.pem"
# key_file  = "/etc/talaria/tls/privkey.pem"
# email = "admin@example.com"
# hosts = ["mail.example.com"]

# Accept raw messages over HTTPS, for setups without a public port 25
# (Cloudflare Email Worker or an external MX relay through the tunnel).
[ingest]
enabled = false
token_file = "/etc/talaria/ingest-token"

# Behind cloudflared or a gateway, trust its address for client-IP headers:
# [http]
# trusted_proxies = ["127.0.0.1", "::1"]
# client_ip_header = "CF-Connecting-IP"
#
# For a TCP gateway (Gateon, HAProxy, nginx stream) in front of SMTP/IMAP,
# list its address. It must send PROXY protocol v1 or v2. Set upstream_tls
# when the gateway terminates TLS on 465/993/995 and forwards plaintext; only
# connections from trusted_proxies count as encrypted, so it needs that list.
# [smtp]
# trusted_proxies = ["10.0.0.2"]
# upstream_tls = false

[filter]
# Checks on inbound SMTP (port 25) before mail is accepted. Tenants add
# their own allow and block lists under Admin > Sender filtering.
#
# DNS blocklists. Spamhaus refuses queries that arrive through public
# resolvers (8.8.8.8, 1.1.1.1, your provider's); run a local resolver such
# as unbound on this machine, or remove it from the list.
dnsbl = ["zen.spamhaus.org", "bl.spamcop.net"]
# Defer the first message from an unknown sender; real servers retry.
greylist = false
greylist_delay = "5m"
# Refuse servers without reverse DNS that points back to their address.
require_rdns = false
# Messages per hour from one address (IPv6: one /64). 0 = no limit.
max_per_ip_hour = 500

[spam]
# Score inbound mail. Each user's filter also learns from what they move
# into and out of Junk, in the webmail or any IMAP app.
enabled = true
# File in Junk at or above this score.
junk_score = 6
# Refuse during SMTP at or above this score. 0 never refuses.
reject_score = 15
# Optional: add the score of a local Rspamd worker.
# rspamd_url = "http://127.0.0.1:11333"
# rspamd_password_file = "/etc/talaria/rspamd-password"

[malware]
# Refuse inbound mail with dangerous attachments: programs and scripts
# (.exe, .js, .iso, .lnk and more, also inside zip files), Office files
# with macros, and files that match the built-in YARA rules.
enabled = true
block_macros = true
# Password-protected archives cannot be looked inside.
block_encrypted_archives = false
# Replace the built-in list of refused file types.
# blocked_extensions = ["exe", "js", "vbs"]
# Extra YARA rules (.yar files). Modules such as "pe" are not supported.
# rules_dir = "/etc/talaria/yara"
# ClamAV adds signature scanning. It needs about 1 GB of memory.
# clamav = "unix:/run/clamav/clamd.ctl"
