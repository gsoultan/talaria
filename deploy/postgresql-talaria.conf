#
# PostgreSQL settings for Talaria and PostgreSQL sharing a 2 vCPU / 2 GB
# machine. Copy to /etc/postgresql/<version>/main/conf.d/talaria.conf and
# restart PostgreSQL. Talaria takes about 768 MB at most (memory_limit plus
# headroom); this keeps PostgreSQL near 600 MB, leaving the rest for the
# kernel's page cache, which both of them read through.

listen_addresses = 'localhost'
max_connections = 30            # Talaria uses at most database.max_conns (10)
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 4MB
maintenance_work_mem = 64MB
wal_buffers = 8MB
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_completion_target = 0.9
random_page_cost = 1.1          # SSD
effective_io_concurrency = 100
# Keep synchronous_commit on (the default): a mail server must not lose
# mail it already accepted, which happens if a commit is still in memory
# when the machine crashes.
jit = off                       # Talaria's queries are short; JIT costs memory
