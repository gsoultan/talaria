syntax = "proto3";

package talaria.v1;

option go_package = "github.com/gsoultan/talaria/gen/go/talaria/v1;talariav1";

// SystemService exposes server metadata and health. It needs no auth.
service SystemService {
  // GetInfo returns build and runtime information.
  rpc GetInfo(GetInfoRequest) returns (GetInfoResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message GetInfoRequest {}

message GetInfoResponse {
  string version = 1;
  string commit = 2;
  string go_version = 3;
  // Process heap in use, in bytes.
  uint64 heap_bytes = 4;
  // Soft memory limit configured for the Go runtime, in bytes.
  int64 memory_limit_bytes = 5;
  int64 uptime_seconds = 6;
}
