syntax = "proto3";

package talaria.v1;

option go_package = "github.com/gsoultan/talaria/gen/go/talaria/v1;talariav1";

// AuthService signs users in to the webmail. The session lives in an
// HttpOnly, SameSite=Strict cookie; tokens never reach JavaScript.
service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse) {}
  rpc Logout(LogoutRequest) returns (LogoutResponse) {}
  // Me returns the signed-in user, or Unauthenticated.
  rpc Me(MeRequest) returns (MeResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse) {}
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_USER = 1;
  ROLE_TENANT_ADMIN = 2;
  ROLE_PLATFORM_ADMIN = 3;
}

message User {
  int64 id = 1;
  string email = 2;
  string display_name = 3;
  Role role = 4;
  int64 tenant_id = 5;
  string tenant_name = 6;
  int64 quota_bytes = 7;
  int64 used_bytes = 8;
  bool suspended = 9;
  int64 created_at = 10;
}

message LoginRequest {
  string email = 1;
  string password = 2;
  bool remember = 3;
}
message LoginResponse { User user = 1; }

message LogoutRequest {}
message LogoutResponse {}

message MeRequest {}
message MeResponse { User user = 1; }

message ChangePasswordRequest {
  string current_password = 1;
  string new_password = 2;
}
message ChangePasswordResponse {}
