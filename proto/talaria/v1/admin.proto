syntax = "proto3";

package talaria.v1;

option go_package = "github.com/gsoultan/talaria/gen/go/talaria/v1;talariav1";

import "talaria/v1/auth.proto";

// AdminService manages tenants, domains, users and aliases. Platform admins
// manage every tenant; tenant admins only their own. tenant_id 0 means the
// caller's tenant.
service AdminService {
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc CreateTenant(CreateTenantRequest) returns (CreateTenantResponse) {}
  rpc UpdateTenant(UpdateTenantRequest) returns (UpdateTenantResponse) {}
  rpc DeleteTenant(DeleteTenantRequest) returns (DeleteTenantResponse) {}

  rpc ListDomains(ListDomainsRequest) returns (ListDomainsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc CreateDomain(CreateDomainRequest) returns (CreateDomainResponse) {}
  rpc DeleteDomain(DeleteDomainRequest) returns (DeleteDomainResponse) {}
  // GetDomainSetup lists the DNS records a domain needs (MX, SPF, DKIM,
  // DMARC, client autodiscovery). It creates the DKIM key if needed.
  rpc GetDomainSetup(GetDomainSetupRequest) returns (GetDomainSetupResponse) {}
  // RotateDKIM replaces the domain's signing key with a new selector.
  rpc RotateDKIM(RotateDKIMRequest) returns (RotateDKIMResponse) {}

  rpc ListQueue(ListQueueRequest) returns (ListQueueResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc RetryQueue(RetryQueueRequest) returns (RetryQueueResponse) {}
  rpc CancelQueue(CancelQueueRequest) returns (CancelQueueResponse) {}

  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {}
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse) {}
  rpc SetUserPassword(SetUserPasswordRequest) returns (SetUserPasswordResponse) {}
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {}

  rpc ListAliases(ListAliasesRequest) returns (ListAliasesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc CreateAlias(CreateAliasRequest) returns (CreateAliasResponse) {}
  rpc DeleteAlias(DeleteAliasRequest) returns (DeleteAliasResponse) {}
}

message Tenant {
  int64 id = 1;
  string name = 2;
  string display_name = 3;
  int64 seat_limit = 4;
  int64 quota_bytes = 5;
  int64 daily_send_limit = 6;
  bool suspended = 7;
  int64 created_at = 8;
  int64 domains = 9;
  int64 users = 10;
  int64 used_bytes = 11;
}

message Domain {
  int64 id = 1;
  int64 tenant_id = 2;
  string name = 3;
  int64 catchall_user_id = 4;
  int64 created_at = 5;
}

message Alias {
  int64 id = 1;
  int64 tenant_id = 2;
  string address = 3;
  int64 user_id = 4;
  string user_email = 5;
}

message ListTenantsRequest {}
message ListTenantsResponse { repeated Tenant tenants = 1; }

message CreateTenantRequest {
  string name = 1;
  string display_name = 2;
  int64 seat_limit = 3;
  int64 quota_bytes = 4;
  int64 daily_send_limit = 5;
}
message CreateTenantResponse { Tenant tenant = 1; }

message UpdateTenantRequest { Tenant tenant = 1; }
message UpdateTenantResponse {}

message DeleteTenantRequest { int64 id = 1; }
message DeleteTenantResponse {}

message ListDomainsRequest { int64 tenant_id = 1; }
message ListDomainsResponse { repeated Domain domains = 1; }

message CreateDomainRequest {
  int64 tenant_id = 1;
  string name = 2;
}
message CreateDomainResponse { Domain domain = 1; }

message DeleteDomainRequest {
  int64 tenant_id = 1;
  int64 id = 2;
}
message DeleteDomainResponse {}

message ListUsersRequest { int64 tenant_id = 1; }
message ListUsersResponse { repeated User users = 1; }

message CreateUserRequest {
  int64 tenant_id = 1;
  string email = 2;
  string display_name = 3;
  string password = 4;
  Role role = 5;
  int64 quota_bytes = 6;
}
message CreateUserResponse { User user = 1; }

message UpdateUserRequest {
  int64 id = 1;
  string display_name = 2;
  Role role = 3;
  int64 quota_bytes = 4;
  bool suspended = 5;
}
message UpdateUserResponse {}

message SetUserPasswordRequest {
  int64 id = 1;
  string password = 2;
}
message SetUserPasswordResponse {}

message DeleteUserRequest { int64 id = 1; }
message DeleteUserResponse {}

message ListAliasesRequest {
  int64 tenant_id = 1;
  int64 user_id = 2; // 0 = all
}
message ListAliasesResponse { repeated Alias aliases = 1; }

message CreateAliasRequest {
  int64 tenant_id = 1;
  string address = 2;
  int64 user_id = 3;
}
message CreateAliasResponse { Alias alias = 1; }

message DeleteAliasRequest {
  int64 tenant_id = 1;
  int64 id = 2;
}
message DeleteAliasResponse {}

message DNSRecord {
  string type = 1;   // MX, TXT, SRV, CNAME
  string name = 2;   // fully qualified
  string value = 3;
  string purpose = 4;
  // Whether the record was found in DNS with the expected value.
  bool ok = 5;
  string found = 6;
}
message GetDomainSetupRequest {
  int64 tenant_id = 1;
  int64 domain_id = 2;
  // Look the records up in DNS and report whether they match.
  bool check = 3;
}
message GetDomainSetupResponse { repeated DNSRecord records = 1; }

message RotateDKIMRequest {
  int64 tenant_id = 1;
  int64 domain_id = 2;
}
message RotateDKIMResponse { DNSRecord record = 1; }

enum QueueStatus {
  QUEUE_STATUS_UNSPECIFIED = 0;
  QUEUE_STATUS_WAITING = 1;
  QUEUE_STATUS_SENDING = 2;
  QUEUE_STATUS_SENT = 3;
  QUEUE_STATUS_BOUNCED = 4;
}

message QueueItem {
  int64 id = 1;
  string from = 2;
  string to = 3;
  QueueStatus status = 4;
  int32 attempts = 5;
  int64 next_attempt = 6;
  string last_error = 7;
  int64 size = 8;
  int64 created_at = 9;
  int64 updated_at = 10;
}
message ListQueueRequest {
  int64 tenant_id = 1;
  QueueStatus status = 2; // unspecified = all
  int32 limit = 3;
}
message ListQueueResponse {
  repeated QueueItem items = 1;
  int64 waiting = 2;
  int64 sent_today = 3;
  int64 bounced_today = 4;
  // Where mail leaves: "relay smtp.example.com:587" or "direct".
  string route = 5;
}
message RetryQueueRequest {
  int64 tenant_id = 1;
  int64 id = 2; // 0 = all waiting items
}
message RetryQueueResponse {}
message CancelQueueRequest {
  int64 tenant_id = 1;
  int64 id = 2;
}
message CancelQueueResponse {}
